# ThreatForge SYR — التوصيف القانوني للواقعة
# الأساس: قانون الجريمة المعلوماتية رقم 20 لعام 2022 (النافذ اعتباراً من 2022-05-18).
# المصادر: مراجعة المركز السوري للإعلام وحرية التعبير (2022) + دليل مكتب غرس القانوني (2026)
# + ملخصات وزارة العدل. أرقام المواد قابلة للتدقيق/التعديل هنا دون كود؛ التوصيف استرشادي
# ويُتحقق مقابل النص الرسمي قبل التقديم القضائي (يُطبع إخلاء المسؤولية داخل التقرير).

[meta]
law_title = "قانون الجريمة المعلوماتية رقم 20 لعام 2022"
law_note = "التوصيف القانوني استرشادي — يجب التحقق من النص الرسمي للقانون عبر جهة مختصة (مكتب محاماة أو فرع مكافحة الجريمة المعلوماتية) قبل التقديم القضائي."

[offenses.extortion]
label = "الابتزاز والتهديد الإلكتروني"
articles = ["المادة 20"]
penalty = "الاعتقال المؤقت من 3 إلى 5 سنوات وغرامة مالية"
template = "تُظهر الوقائع المؤشرات المكوّنة لجريمة الابتزاز والتهديد الإلكتروني المنصوص عليها في المادة 20 من قانون الجريمة المعلوماتية رقم 20 لعام 2022، المتمثلة في التهديد بنشر بيانات أو تسجيلات خاصة بقصد الحصول على أموال أو دفع الضحية إلى فعل غير مشروع. يُوصى بعدم الرضوخ لأي طلب مالي، والاحتفاظ بالأدلة الموثّقة (لقطات الشاشة والنصوص والتوقيتات)، وتقديم شكوى رسمية لدى النيابة العامة المختصة عبر فرع مكافحة الجريمة المعلوماتية لإدارة الأمن الجنائي."

[offenses.fraud]
label = "الاحتيال والاستيلاء المالي الرقمي"
articles = ["المادتان 16 و17"]
penalty = "الحبس من 3 إلى 5 سنوات وغرامات مالية مشددة"
template = "تشير الوقائع إلى مؤشرات الاحتيال المالي الإلكتروني المنصوص عليه في المادتين 16 و17 من قانون الجريمة المعلوماتية رقم 20 لعام 2022، المتمثل في الحصول على أموال الضحية أو بيانات بطاقاتها/حساباتها المصرفية عبر أساليب الخداع الرقمي والتصيّد (Phishing). يُوصى بعدم مشاركة أي بيانات سرية أو رموز تحقق، وتوثيق القنوات والرسائل، وإبلاغ الجهة المالية مقدّم الخدمة فوراً وتقديم شكوى رسمية."

[offenses.privacy]
label = "انتهاك الخصوصية ونشر المحادثات"
articles = ["المادتان 21 و22"]
penalty = "الحبس من شهر إلى ستة أشهر (ويشتد عند النشر حتى 3 سنوات) وغرامة مالية"
template = "تُظهر الوقائع مؤشرات انتهاك الخصوصية المنصوص عليه في المادتين 21 و22 من قانون الجريمة المعلوماتية رقم 20 لعام 2022، المتمثل في تسجيل محادثات أو صور خاصة دون رضا صاحبها أو تهديد بنشرها. يُوصى بتوثيق الواقعة وتقديم شكوى رسمية، إذ يُعدّ تصوير المحادثات الخاصة ونشرها دون موافقة أطرافها جريمة انتهاك خصوصية وفق القانون المذكور."

[offenses.threat]
label = "التهديد الإلكتروني"
articles = ["المادة 20"]
penalty = "الاعتقال المؤقت من 3 إلى 5 سنوات وغرامة مالية"
template = "تُظهر الوقائع مؤشرات التهديد الإلكتروني المنصوص عليه ضمن المادة 20 من قانون الجريمة المعلوماتية رقم 20 لعام 2022، المتمثلة في توجيه تهديدات بفعل يمسّ سلامة الضحية أو أهلها. يُوصى بعدم الرد أو التصعيد، وحفظ الأدلة كاملة، وتقديم شكوى رسمية لدى النيابة العامة المختصة."